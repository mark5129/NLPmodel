
# Here we define the parameters used in various scripts.

# Whether to perform the data preprocessing step
preprocess_data: False

# Whether to perform the model training step
train_model: True

# K-means clustering
num_topics: 10

# What data to use?
# raw, cleaned, stemmed
what_data: cleaned

# Names of files and directories

# Raw data
pro_media_dir: raw_data/pro_media.csv
reg_media_dir: raw_data/reg_media.csv

# stopwords removed
pro_media_cleaned_dir: data/pro_media_cleaned.csv
reg_media_cleaned_dir: data/reg_media_cleaned.csv

# stemming of words
pro_media_stemmed_dir: data/pro_media_stemmed.csv
reg_media_stemmed_dir: data/reg_media_stemmed.csv

# Specter model
train_specter2: True




